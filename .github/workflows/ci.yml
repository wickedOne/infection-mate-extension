name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    DEFAULT_PHP: '8.5'

jobs:
    tests:
        name: Tests (PHP ${{ matrix.php }}, ${{ matrix.dependencies }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4', '8.5']
                dependencies: [lowest, highest]
        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  tools: composer:v2

            - uses: ramsey/composer-install@4.0.0
              with:
                  dependency-versions: ${{ matrix.dependencies }}
                  composer-options: --prefer-stable

            - run: composer test

    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.DEFAULT_PHP }}
                  coverage: none
                  tools: composer:v2

            - uses: ramsey/composer-install@4.0.0

            - run: composer lint

            - run: vendor/bin/mate skills:validate

    mutation:
        name: Mutation tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.DEFAULT_PHP }}
                  coverage: pcov
                  tools: composer:v2

            - uses: ramsey/composer-install@4.0.0

            - run: vendor/bin/infection --threads=max --no-progress --no-interaction --no-ansi --logger-github
